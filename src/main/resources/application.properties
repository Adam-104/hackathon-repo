spring.application.name=smart-recruit
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruit}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Tables are created and updated automatically (fast for a hackathon).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# At least 32 characters (or a base64 string of 32+ bytes). Set a long random value in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.minutes=${JWT_MINUTES:120}

# The administrator account is created at startup from these two settings.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed-demo=${SEED_DEMO:false}

# Any OpenAI-compatible chat API works (Gemini, Groq, OpenAI).
app.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-2.5-flash}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
